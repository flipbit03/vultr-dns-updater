[package]
name = "vultr-dns-updater"
version = "0.0.0"
edition = "2024"
description = "Dynamic DNS for Vultr DNS: keeps A records pointed at your public IPv4"
license = "MIT"
repository = "https://github.com/flipbit03/vultr-dns-updater"
readme = "README.md"
keywords = ["vultr", "dns", "ddns", "dynamic-dns", "cli"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".github/", "install.sh", "CLAUDE.md", "CONTRIBUTING.md", "Makefile"]

[[bin]]
name = "vultr-dns"
path = "src/main.rs"

[features]
binary-release = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
colored = "3"
home = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
sha2 = "0.10"
tabled = "0.20"
tokio = { version = "1", features = ["rt", "macros", "net"] }
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
